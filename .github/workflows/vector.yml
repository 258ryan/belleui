name: Build Chooser
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-vector
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :vector:assembleDebug
      - run: cp vector/build/outputs/apk/debug/vector-debug.apk BelleUI-Chooser-Vector.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-vector-${{ github.run_number }}
          path: BelleUI-Chooser-Vector.apk
          if-no-vector-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vector-latest --yes --cleanup-tag || true
          gh release create vector-latest BelleUI-Chooser-Vector.apk \
            --title "BelleUI Chooser (latest build)" \
            --notes "Chooser built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
