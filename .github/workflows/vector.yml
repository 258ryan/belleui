name: Build Chooser
# Runs only when this app (or the shared kit / build vector) changes, so one app never rebuilds the others.
on:
  push:
    branches: [belle/all]
    paths:
      - 'vector/**'
      - 'belle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/vector.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-vector
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :vector:assembleDebug
      - run: cp vector/build/outputs/apk/debug/vector-debug.apk BelleUI-Chooser-Vector.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-vector-${{ github.run_number }}
          path: BelleUI-Chooser-Vector.apk
          if-no-vector-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vector-latest --yes --cleanup-tag || true
          gh release create vector-latest BelleUI-Chooser-Vector.apk \
            --title "BelleUI Chooser (latest build)" \
            --notes "Chooser built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
