name: CI
# One build of everything when code changes on belle/all (cancels an older run still going).
# The per-app, whole-set and System UI workflows are manual: Actions tab, Run workflow.
on:
  push:
    branches: [belle/all]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'magisk/**'
      - 'keystore/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
