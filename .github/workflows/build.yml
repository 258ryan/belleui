name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      # one APK per module on this branch: launcher (app-debug.apk) plus the app, if any
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-apks-${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/*.apk
            music/build/outputs/apk/debug/*.apk
            clock/build/outputs/apk/debug/*.apk
            gallery/build/outputs/apk/debug/*.apk
            browser/build/outputs/apk/debug/*.apk
          if-no-files-found: error
