name: Build Gallery v2 (update APK)
# Manual: builds the reworked Gallery (branch claude/gallery-v2) as an APK that installs over the current Gallery as an
# update. It is not part of any Magisk module.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/gallery-v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :gallery:assembleDebug
      - run: cp gallery/build/outputs/apk/debug/gallery-debug.apk BelleUI-Gallery-v2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BelleUI-Gallery-v2
          path: BelleUI-Gallery-v2.apk
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gallery-v2 >/dev/null 2>&1 || gh release create gallery-v2 --title "Gallery v2 (update)" --notes "Install BelleUI-Gallery-v2.apk over the current Gallery." --target "$GITHUB_SHA"
          gh release upload gallery-v2 BelleUI-Gallery-v2.apk --clobber
