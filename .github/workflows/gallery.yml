name: Build Gallery
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-gallery
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :gallery:assembleDebug
      - run: cp gallery/build/outputs/apk/debug/gallery-debug.apk BelleUI-Gallery.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-gallery-${{ github.run_number }}
          path: BelleUI-Gallery.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete gallery-latest --yes --cleanup-tag || true
          gh release create gallery-latest BelleUI-Gallery.apk \
            --title "BelleUI Gallery (latest build)" \
            --notes "Gallery built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
