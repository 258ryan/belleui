name: Build Notes
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-notes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :notes:assembleDebug
      - run: cp notes/build/outputs/apk/debug/notes-debug.apk BelleUI-Notes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-notes-${{ github.run_number }}
          path: BelleUI-Notes.apk
          if-no-notes-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete notes-latest --yes --cleanup-tag || true
          gh release create notes-latest BelleUI-Notes.apk \
            --title "BelleUI Notes (latest build)" \
            --notes "Notes built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
