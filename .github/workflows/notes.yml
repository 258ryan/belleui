name: Build Notes
# Runs only when this app (or the shared kit / build notes) changes, so one app never rebuilds the others.
on:
  push:
    branches: [belle/all]
    paths:
      - 'notes/**'
      - 'belle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/notes.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-notes
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :notes:assembleDebug
      - run: cp notes/build/outputs/apk/debug/notes-debug.apk BelleUI-Notes.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-notes-${{ github.run_number }}
          path: BelleUI-Notes.apk
          if-no-notes-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete notes-latest --yes --cleanup-tag || true
          gh release create notes-latest BelleUI-Notes.apk \
            --title "BelleUI Notes (latest build)" \
            --notes "Notes built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
