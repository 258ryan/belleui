name: Build Launcher
# Runs only when this app (or the shared kit / build files) changes, so one app never rebuilds the others.
on:
  push:
    branches: [belle/all]
    paths:
      - 'app/**'
      - 'belle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-launcher
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk BelleUI-Launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-launcher-${{ github.run_number }}
          path: BelleUI-Launcher.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete launcher-latest --yes --cleanup-tag || true
          gh release create launcher-latest BelleUI-Launcher.apk \
            --title "BelleUI Launcher (latest build)" \
            --notes "Launcher built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
