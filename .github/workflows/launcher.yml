name: Build Launcher
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-launcher
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk BelleUI-Launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-launcher-${{ github.run_number }}
          path: BelleUI-Launcher.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete launcher-latest --yes --cleanup-tag || true
          gh release create launcher-latest BelleUI-Launcher.apk \
            --title "BelleUI Launcher (latest build)" \
            --notes "Launcher built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
