name: Build launcher
# This branch has its own workflow: it builds only the launcher module and publishes only its own release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :app:assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk BelleUI-Launcher.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-launcher-${{ github.run_number }}
          path: BelleUI-Launcher.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete launcher-latest --yes --cleanup-tag || true
          gh release create launcher-latest BelleUI-Launcher.apk \
            --title "BelleUI Launcher (latest build)" \
            --notes "Launcher built from branch claude/kind-darwin-50q37s at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
