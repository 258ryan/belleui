name: Build Files
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-files
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :files:assembleDebug
      - run: cp files/build/outputs/apk/debug/files-debug.apk BelleUI-Files.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-files-${{ github.run_number }}
          path: BelleUI-Files.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete files-latest --yes --cleanup-tag || true
          gh release create files-latest BelleUI-Files.apk \
            --title "BelleUI Files (latest build)" \
            --notes "Files built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
