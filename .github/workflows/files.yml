name: Build Files app
# This branch has its own workflow: it builds only the Files module and publishes only its own release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :files:assembleDebug
      - run: cp files/build/outputs/apk/debug/files-debug.apk BelleUI-Files.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-files-${{ github.run_number }}
          path: BelleUI-Files.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete files-latest --yes --cleanup-tag || true
          gh release create files-latest BelleUI-Files.apk \
            --title "BelleUI Files (latest build)" \
            --notes "File manager built from branch belle/files at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
