name: Build Recorder
# Runs only when this app (or the shared kit / build recorder) changes, so one app never rebuilds the others.
on:
  push:
    branches: [belle/all]
    paths:
      - 'recorder/**'
      - 'belle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/recorder.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-recorder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :recorder:assembleDebug
      - run: cp recorder/build/outputs/apk/debug/recorder-debug.apk BelleUI-Recorder.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-recorder-${{ github.run_number }}
          path: BelleUI-Recorder.apk
          if-no-recorder-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete recorder-latest --yes --cleanup-tag || true
          gh release create recorder-latest BelleUI-Recorder.apk \
            --title "BelleUI Recorder (latest build)" \
            --notes "Recorder built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
