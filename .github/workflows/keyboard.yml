name: Build Keyboard
# Runs only when this app (or the shared kit / build keyboard) changes, so one app never rebuilds the others.
on:
  push:
    branches: [belle/all]
    paths:
      - 'keyboard/**'
      - 'belle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/keyboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-keyboard
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :keyboard:assembleDebug
      - run: cp keyboard/build/outputs/apk/debug/keyboard-debug.apk BelleUI-Keyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-keyboard-${{ github.run_number }}
          path: BelleUI-Keyboard.apk
          if-no-keyboard-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete keyboard-latest --yes --cleanup-tag || true
          gh release create keyboard-latest BelleUI-Keyboard.apk \
            --title "BelleUI Keyboard (latest build)" \
            --notes "Two-row gamepad keyboard built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
