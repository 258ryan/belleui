name: Build Video
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-video
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :video:assembleDebug
      - run: cp video/build/outputs/apk/debug/video-debug.apk BelleUI-Video.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-video-${{ github.run_number }}
          path: BelleUI-Video.apk
          if-no-video-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete video-latest --yes --cleanup-tag || true
          gh release create video-latest BelleUI-Video.apk \
            --title "BelleUI Video (latest build)" \
            --notes "Video built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
