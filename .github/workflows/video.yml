name: Build Video app
# This branch has its own workflow: it builds only the Video module and publishes only its own release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :video:assembleDebug
      - run: cp video/build/outputs/apk/debug/video-debug.apk BelleUI-Video.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-video-${{ github.run_number }}
          path: BelleUI-Video.apk
          if-no-video-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete video-latest --yes --cleanup-tag || true
          gh release create video-latest BelleUI-Video.apk \
            --title "BelleUI Video (latest build)" \
            --notes "Video player built from branch belle/video at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
