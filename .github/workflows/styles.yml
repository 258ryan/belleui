name: Build Styles app
# This branch has its own workflow: it builds only the Styles module and publishes only its own release.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :styles:assembleDebug
      - run: cp styles/build/outputs/apk/debug/styles-debug.apk BelleUI-Styles.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-styles-${{ github.run_number }}
          path: BelleUI-Styles.apk
          if-no-styles-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete styles-latest --yes --cleanup-tag || true
          gh release create styles-latest BelleUI-Styles.apk \
            --title "BelleUI Styles (latest build)" \
            --notes "Wallpapers and sounds built from branch belle/styles at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
