name: Build Styles
# Runs only when this app (or the shared kit / build styles) changes, so one app never rebuilds the others.
on:
  push:
    branches: [belle/all]
    paths:
      - 'styles/**'
      - 'belle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/styles.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-styles
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :styles:assembleDebug
      - run: cp styles/build/outputs/apk/debug/styles-debug.apk BelleUI-Styles.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-styles-${{ github.run_number }}
          path: BelleUI-Styles.apk
          if-no-styles-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete styles-latest --yes --cleanup-tag || true
          gh release create styles-latest BelleUI-Styles.apk \
            --title "BelleUI Styles (latest build)" \
            --notes "Wallpapers and sounds built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
