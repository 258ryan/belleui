name: Build Music
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-music
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :music:assembleDebug
      - run: cp music/build/outputs/apk/debug/music-debug.apk BelleUI-Music.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-music-${{ github.run_number }}
          path: BelleUI-Music.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete music-latest --yes --cleanup-tag || true
          gh release create music-latest BelleUI-Music.apk \
            --title "BelleUI Music (latest build)" \
            --notes "Music built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
