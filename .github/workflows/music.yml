name: Build Music
# Runs only when this app (or the shared kit / build files) changes, so one app never rebuilds the others.
on:
  push:
    branches: [belle/all]
    paths:
      - 'music/**'
      - 'belle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/music.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-music
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :music:assembleDebug
      - run: cp music/build/outputs/apk/debug/music-debug.apk BelleUI-Music.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-music-${{ github.run_number }}
          path: BelleUI-Music.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete music-latest --yes --cleanup-tag || true
          gh release create music-latest BelleUI-Music.apk \
            --title "BelleUI Music (latest build)" \
            --notes "Music built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
