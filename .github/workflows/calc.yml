name: Build Calculator
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-calc
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :calc:assembleDebug
      - run: cp calc/build/outputs/apk/debug/calc-debug.apk BelleUI-Calculator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-calc-${{ github.run_number }}
          path: BelleUI-Calculator.apk
          if-no-calc-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete calc-latest --yes --cleanup-tag || true
          gh release create calc-latest BelleUI-Calculator.apk \
            --title "BelleUI Calculator (latest build)" \
            --notes "Calculator built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
