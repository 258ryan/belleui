name: Build the framework modules
# Manual: the Belle colour overlay and the Nokia Sans font, each its own Magisk module (so either can be removed alone).
on:
  workflow_dispatch:
  push:
    branches: [e6-firmware-layout]
    paths:
      - framework-overlay/**
      - magisk/framework/**
      - magisk/font/**
      - .github/workflows/framework.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :framework-overlay:assembleDebug
      - name: Pack the modules
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=framework-overlay/build/outputs/apk/debug/framework-overlay-debug.apk
          $BT/aapt2 dump badging $APK | head -3 || true
          $BT/apksigner verify --print-certs $APK | grep -E "SHA-1|Verifies" || true
          rm -rf fw && cp -r magisk/framework fw
          mkdir -p fw/system/product/overlay && cp $APK fw/system/product/overlay/BelleUIFramework.apk
          rm -f fw/README.md && (cd fw && zip -qr ../BelleUI-Framework-Magisk.zip .)
          rm -rf ft && cp -r magisk/font ft
          mkdir -p ft/fonts && cp belle/src/main/assets/fonts/nosnr60.ttf belle/src/main/assets/fonts/nssb60.ttf ft/fonts/
          rm -f ft/README.md && (cd ft && zip -qr ../BelleUI-Font-Magisk.zip .)
          ls -la BelleUI-Framework-Magisk.zip BelleUI-Font-Magisk.zip
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-framework-modules
          path: |
            BelleUI-Framework-Magisk.zip
            BelleUI-Font-Magisk.zip
          if-no-files-found: error
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=framework-preview
          NOTES="Belle colours for the Android framework (static overlay) and the Nokia Sans S60 system font, as two Magisk modules, built from $GITHUB_REF_NAME at ${GITHUB_SHA::7}."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BelleUI-Framework-Magisk.zip BelleUI-Font-Magisk.zip --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" BelleUI-Framework-Magisk.zip BelleUI-Font-Magisk.zip --title "BelleUI framework modules (preview)" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
