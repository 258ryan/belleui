name: Build the whole-set Magisk module
# Manual: builds every app and packs them into one Magisk module (release module-latest).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # builds the branch the workflow is run on (belle/all when started from there)
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleDebug
      - name: Restyle the stock System UI
        run: |
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          java -jar apktool.jar d -f -o sysui-dec sysui-stock/SystemUI-stock.apk
          # the Belle panels (from the from-scratch System UI) are merged into the stock one and called from it
          java -jar apktool.jar d -f -o belle-dec sysui/build/outputs/apk/debug/sysui-debug.apk
          python3 sysui-stock/restyle.py sysui-dec belle-dec
          java -jar apktool.jar b -o sysui-unsigned.apk sysui-dec
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 sysui-unsigned.apk sysui-aligned.apk
          $BT/apksigner sign --ks keystore/aosp-platform.jks --ks-pass pass:android --ks-key-alias platform --key-pass pass:android --out SystemUI-restyled.apk sysui-aligned.apk
          $BT/apksigner verify --print-certs SystemUI-restyled.apk | grep -E "SHA-1" || true
      - name: Pack the module
        run: |
          rm -rf module && cp -r magisk/all module
          mkdir -p module/system/priv-app module/system/app module/extra
          put() { # module, folder name, priv|app
            f="$1/build/outputs/apk/debug/$1-debug.apk"
            [ "$1" = app ] && f="app/build/outputs/apk/debug/app-debug.apk"
            if [ ! -f "$f" ]; then echo "missing $f"; exit 1; fi
            d="module/system/$3/$2"; mkdir -p "$d"; cp "$f" "$d/$2.apk"
          }
          put app BelleUILauncher priv-app
          put settings BelleUISettings priv-app
          put files BelleUIFiles priv-app
          put picker BelleUIPicker priv-app
          for pair in music:Music clock:Clock gallery:Gallery browser:Browser games:Games styles:Styles keyboard:Keyboard video:Video notes:Notes calc:Calculator recorder:Recorder; do
            put "${pair%%:*}" "BelleUI${pair##*:}" app
          done
          # both System UIs ride along in extra/; post-fs-data.sh puts the chosen one in place at boot
          cp sysui/build/outputs/apk/debug/sysui-debug.apk module/extra/SystemUI-belle.apk
          cp SystemUI-restyled.apk module/extra/SystemUI-restyled.apk
          # the Android framework in Belle dress: the overlay (/product/overlay) and the Nokia Sans font files (customize.sh places them)
          mkdir -p module/system/product/overlay module/fonts
          cp framework-overlay/build/outputs/apk/debug/framework-overlay-debug.apk module/system/product/overlay/BelleUIFramework.apk
          cp belle/src/main/assets/fonts/nosnr60.ttf belle/src/main/assets/fonts/nssb60.ttf module/fonts/
          mkdir -p module/system/system_ext/etc/permissions
          cp magisk/sysui/system/system_ext/etc/permissions/privapp-permissions-belleui-sysui.xml module/system/system_ext/etc/permissions/
          rm -f module/README.md
          (cd module && zip -qr ../BelleUI-Complete-Magisk.zip .)
          ls -la BelleUI-Complete-Magisk.zip
          unzip -l BelleUI-Complete-Magisk.zip | tail -25
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-complete-module
          path: BelleUI-Complete-Magisk.zip
          if-no-files-found: error
      - name: Publish release
        # the zip is already attached to this run as an artifact; a release problem must not fail the build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # belle/all publishes module-latest; a build of any other branch goes to its own module-preview release
          TAG=module-latest; TITLE="BelleUI complete (Magisk module)"
          if [ "$GITHUB_REF_NAME" != "belle/all" ]; then TAG=module-preview; TITLE="BelleUI complete (Magisk module, preview of $GITHUB_REF_NAME)"; fi
          NOTES="The Belle launcher, every Belle app and the Belle System UI as system apps, built from $GITHUB_REF_NAME at ${GITHUB_SHA::7}. Flash in Magisk (Modules > Install from storage) and reboot."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" BelleUI-Complete-Magisk.zip --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" BelleUI-Complete-Magisk.zip --title "$TITLE" --notes "$NOTES" --prerelease --target "$GITHUB_SHA"
          fi
