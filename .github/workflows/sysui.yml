name: Build the System UI module
# Manual: builds ONLY the restyled stock System UI as its own Magisk module (release sysui-restyled-latest).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: belle/all
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :sysui:assembleDebug
      - name: Restyle the stock System UI
        run: |
          curl -sSL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          java -jar apktool.jar d -f -o sysui-dec sysui-stock/SystemUI-stock.apk
          # the Belle panels (from the from-scratch System UI) are merged into the stock one and called from it
          java -jar apktool.jar d -f -o belle-dec sysui/build/outputs/apk/debug/sysui-debug.apk
          python3 sysui-stock/restyle.py sysui-dec belle-dec
          java -jar apktool.jar b -o sysui-unsigned.apk sysui-dec
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f -p 4 sysui-unsigned.apk sysui-aligned.apk
          $BT/apksigner sign --ks keystore/aosp-platform.jks --ks-pass pass:android --ks-key-alias platform --key-pass pass:android --out SystemUI-restyled.apk sysui-aligned.apk
          $BT/apksigner verify --print-certs SystemUI-restyled.apk | grep -E "SHA-1" || true
      - name: Pack the module
        run: |
          rm -rf module && cp -r magisk/sysui-restyled module
          cp SystemUI-restyled.apk module/system/system_ext/priv-app/SystemUI/SystemUI.apk
          (cd module && zip -qr ../BelleUI-SystemUI-Only-Magisk.zip .)
          unzip -l BelleUI-SystemUI-Only-Magisk.zip
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-systemui-only
          path: BelleUI-SystemUI-Only-Magisk.zip
          if-no-files-found: error
      - name: Publish release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view sysui-restyled-latest >/dev/null 2>&1; then
            gh release upload sysui-restyled-latest BelleUI-SystemUI-Only-Magisk.zip --clobber
          else
            gh release create sysui-restyled-latest BelleUI-SystemUI-Only-Magisk.zip \
              --title "BelleUI System UI only (restyled stock)" \
              --notes "Only the System UI mod, built from belle/all at ${GITHUB_SHA::7}. Flash in Magisk and reboot." \
              --prerelease --target "$GITHUB_SHA"
          fi
