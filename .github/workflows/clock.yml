name: Build Clock
# Runs only when this app (or the shared kit / build files) changes, so one app never rebuilds the others.
on:
  push:
    branches: [belle/all]
    paths:
      - 'clock/**'
      - 'belle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/clock.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clock
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :clock:assembleDebug
      - run: cp clock/build/outputs/apk/debug/clock-debug.apk BelleUI-Clock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-clock-${{ github.run_number }}
          path: BelleUI-Clock.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete clock-latest --yes --cleanup-tag || true
          gh release create clock-latest BelleUI-Clock.apk \
            --title "BelleUI Clock (latest build)" \
            --notes "Clock built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
