name: Build Clock
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-clock
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :clock:assembleDebug
      - run: cp clock/build/outputs/apk/debug/clock-debug.apk BelleUI-Clock.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-clock-${{ github.run_number }}
          path: BelleUI-Clock.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete clock-latest --yes --cleanup-tag || true
          gh release create clock-latest BelleUI-Clock.apk \
            --title "BelleUI Clock (latest build)" \
            --notes "Clock built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
