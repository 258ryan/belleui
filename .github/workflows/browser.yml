name: Build Browser
# Runs only when this app (or the shared kit / build files) changes, so one app never rebuilds the others.
on:
  push:
    branches: [belle/all]
    paths:
      - 'browser/**'
      - 'belle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-browser
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :browser:assembleDebug
      - run: cp browser/build/outputs/apk/debug/browser-debug.apk BelleUI-Browser.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-browser-${{ github.run_number }}
          path: BelleUI-Browser.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete browser-latest --yes --cleanup-tag || true
          gh release create browser-latest BelleUI-Browser.apk \
            --title "BelleUI Browser (latest build)" \
            --notes "Browser built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
