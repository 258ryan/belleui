name: Build Browser
# Manual only: run it from the Actions tab when you want this app's own release. Day-to-day checking is ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-browser
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :browser:assembleDebug
      - run: cp browser/build/outputs/apk/debug/browser-debug.apk BelleUI-Browser.apk
      - uses: actions/upload-artifact@v4
        with:
          name: belleui-browser-${{ github.run_number }}
          path: BelleUI-Browser.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete browser-latest --yes --cleanup-tag || true
          gh release create browser-latest BelleUI-Browser.apk \
            --title "BelleUI Browser (latest build)" \
            --notes "Browser built from branch belle/all at ${GITHUB_SHA::7}." \
            --prerelease --target "$GITHUB_SHA"
